<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>The Juice Bar • FUTURE MENU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b12; --bg2:#0b1220; --surface:rgba(15,24,38,.82);
  --surface2:rgba(19,31,48,.92); --text:#f4f8ff; --muted:#8ea0b8;
  --cyan:#F8BE03; --lime:#b7ff4a; --pink:#ff3cac; --purple:#7c4dff;
  --line:rgba(120,170,210,.18); --danger:#ff5577; --orange:#F8BE03;
  --glow:0 0 28px rgba(248,190,3,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:
 radial-gradient(circle at 10% -10%,rgba(248,190,3,.14),transparent 30%),
 radial-gradient(circle at 100% 0%,rgba(255,60,172,.13),transparent 30%),
 linear-gradient(180deg,var(--bg),var(--bg2) 55%,#060a11);
 color:var(--text);min-height:100vh;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:28px 28px}
.disp{font-family:Orbitron,system-ui,sans-serif;letter-spacing:.02em}
.mono{font-family:"IBM Plex Mono",monospace}
button,input{font-family:inherit}button{cursor:pointer;border:none}
.scroll::-webkit-scrollbar{height:4px;width:4px}.scroll::-webkit-scrollbar-thumb{background:#27415a;border-radius:99px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,190,3,.18)}50%{box-shadow:0 0 0 10px rgba(248,190,3,0)}}
.pop{animation:pop .25s ease}.rise{animation:rise .35s ease both}

.hero{
 position:relative;overflow:hidden;text-align:center;padding:34px 18px 28px;
 background:linear-gradient(135deg,rgba(7,15,27,.97),rgba(14,21,39,.9));
 border-bottom:1px solid var(--line);
}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:var(--cyan);filter:blur(80px);opacity:.13;right:-70px;top:-80px}
.hero-row{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:1}
.hero h1{font-size:clamp(25px,7vw,40px);margin:0;font-weight:800;color:#fff}
.hero p{color:#9eb0c7;font-size:13px;margin:8px 0 0;position:relative;z-index:1}
.hero .hero-row svg{filter:drop-shadow(0 0 8px var(--cyan))}

.catnav{
 position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;
 padding:10px 12px;background:rgba(7,11,18,.86);backdrop-filter:blur(18px);
 border-bottom:1px solid var(--line)
}
.pill{
 white-space:nowrap;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:700;
 background:rgba(18,30,46,.8);color:#b7c6d9;border:1px solid var(--line)
}
.pill.active{
 color:#031218;background:linear-gradient(90deg,var(--cyan),#FFD54A);
 border-color:var(--cyan);box-shadow:0 0 18px rgba(248,190,3,.2)
}

.menu-wrap{width:100%;max-width:560px;margin:0 auto;padding:14px 12px 100px}
.cat-block{margin-bottom:26px;scroll-margin-top:62px}
.cat-title{display:flex;align-items:center;gap:8px;margin:20px 2px 10px}
.cat-title h2{font-size:16px;margin:0;color:#e9f3ff}
.cat-title svg{filter:drop-shadow(0 0 7px var(--lime))}
.item{
 background:linear-gradient(145deg,rgba(18,29,45,.92),rgba(11,19,31,.9));
 border:1px solid var(--line);border-radius:18px;padding:10px;
 display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;
 box-shadow:0 8px 24px rgba(0,0,0,.16);transition:.2s
}
.item:active{transform:scale(.985);border-color:rgba(248,190,3,.38)}
@keyframes itemAdded{0%{transform:scale(1);box-shadow:0 8px 24px rgba(0,0,0,.16)}25%{transform:scale(1.025);box-shadow:0 0 28px rgba(248,190,3,.45),0 8px 24px rgba(0,0,0,.16)}55%{transform:scale(.985)}100%{transform:scale(1);box-shadow:0 8px 24px rgba(0,0,0,.16)}}
@keyframes addButtonPop{0%{transform:scale(1);filter:brightness(1)}35%{transform:scale(1.22);filter:brightness(1.5)}70%{transform:scale(.92)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes cartBadgePop{0%{transform:scale(.5);opacity:.5}55%{transform:scale(1.35)}100%{transform:scale(1);opacity:1}}

.item.added{animation:itemAdded .5s cubic-bezier(.2,.8,.2,1)}
.addbtn.added,.stepbtn.dark.added{animation:addButtonPop .42s cubic-bezier(.2,.8,.2,1)}
@keyframes itemRemoved{0%{transform:scale(1);box-shadow:0 8px 24px rgba(0,0,0,.16)}25%{transform:scale(.975);box-shadow:0 0 22px rgba(255,85,119,.4),0 8px 24px rgba(0,0,0,.16)}55%{transform:scale(1.008)}100%{transform:scale(1);box-shadow:0 8px 24px rgba(0,0,0,.16)}}
@keyframes subButtonPop{0%{transform:scale(1);filter:brightness(1)}35%{transform:scale(.8);filter:brightness(1.35) saturate(1.4)}70%{transform:scale(1.08)}100%{transform:scale(1);filter:brightness(1)}}
.item.removed{animation:itemRemoved .42s cubic-bezier(.2,.8,.2,1)}
.stepbtn.removed{animation:subButtonPop .38s cubic-bezier(.2,.8,.2,1);border-color:rgba(255,85,119,.5)!important}
.cupbtn.added{animation:pulse .9s ease-in-out 1,cartPop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes cartPop{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-4deg)}65%{transform:scale(.95) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.cupbadge.added{animation:cartBadgePop .4s ease-out}
.item-left{display:flex;align-items:center;gap:11px;min-width:0}
.item-thumb{width:88px;height:88px;border-radius:17px;overflow:hidden;flex-shrink:0;background:#111c2b;border:1px solid rgba(255,255,255,.08)}
.item-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.edit-thumb{width:44px;height:44px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#111c2b}
.edit-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.upload-label{font-size:11px;color:var(--muted);cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 8px;white-space:nowrap}
.item-name{font-weight:750;margin:0 0 3px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-desc{font-size:11px;color:var(--muted);margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:235px}
.item-price{font-size:14px;color:var(--lime);font-weight:800;margin:0}
.addbtn{
 flex-shrink:0;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),#C98A00);
 display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(248,190,3,.22)
}
.stepper{flex-shrink:0;display:flex;align-items:center;gap:6px;background:#0a1421;border:1px solid var(--line);border-radius:999px;padding:4px}
.stepbtn{width:31px;height:31px;border-radius:999px;background:#17263a;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.stepbtn.dark{background:linear-gradient(135deg,var(--cyan),#C98A00);border-color:transparent}
.stepqty{width:16px;text-align:center;color:#fff}
.staffbtn{display:block;margin:10px auto 0;font-size:11px;color:#62758d;background:none}

.cupbtn{position:fixed;bottom:18px;right:16px;z-index:30;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5));animation:pulse 2.2s infinite}
.cupbadge{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(255,60,172,.5)}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center}
.drawer{
 width:100%;max-width:560px;background:linear-gradient(180deg,#111d2d,#09121e);
 border:1px solid var(--line);border-bottom:none;border-radius:25px 25px 0 0;padding:18px 18px 92px;
 max-height:88vh;overflow-y:auto;box-shadow:0 -15px 50px rgba(0,0,0,.45)
}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.drawer-head button{background:none;color:#9fb0c4}
.cart-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.05)}
.cart-input{width:100%;border:1px solid var(--line);background:#091523;color:#fff;border-radius:13px;padding:12px 14px;font-size:13px;margin-bottom:8px;outline:none}
.cart-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(248,190,3,.08)}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-weight:700}
.checkout-fixed{
  position:fixed;
  left:14px;
  bottom:14px;
  z-index:70;
  width:min(360px,calc(100vw - 28px));
  min-height:58px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(10,24,40,.97),rgba(12,29,47,.95));
  border:1px solid rgba(248,190,3,.38);
  box-shadow:0 10px 35px rgba(0,0,0,.5),0 0 24px rgba(248,190,3,.12);
  backdrop-filter:blur(16px);
}
.checkout-fixed .checkout-summary{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  min-width:0;
}
.checkout-fixed .checkout-label{
  font-size:10px;
  color:#7f93ab;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:800;
}
.checkout-fixed .checkout-total{
  font-family:"IBM Plex Mono",monospace;
  font-size:18px;
  color:#fff;
  font-weight:800;
  white-space:nowrap;
}
.checkout-fixed .checkout-count{
  font-size:11px;
  color:#91a5bb;
  white-space:nowrap;
}
.checkout-fixed .checkout-open{
  flex:0 0 auto;
  padding:12px 16px;
  border-radius:12px;
  background:linear-gradient(90deg,var(--cyan),#C98A00);
  color:#031218;
  font-weight:900;
  box-shadow:0 0 18px rgba(248,190,3,.2);
}
.checkout-fixed .checkout-open:active{transform:scale(.97)}
.checkout-fixed.empty .checkout-open{opacity:.62}
.checkoutbtn{width:100%;padding:15px 18px;border-radius:14px;background:linear-gradient(90deg,var(--cyan),#C98A00);color:#031218;font-weight:900;box-shadow:0 0 22px rgba(248,190,3,.18)}
.checkoutbtn:disabled{opacity:.6}



/* Live customer order tracking */
.track-wrap{
  min-height:100vh;
  padding:28px 16px 34px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  background:
    radial-gradient(circle at 15% 8%,rgba(248,190,3,.11),transparent 30%),
    radial-gradient(circle at 90% 12%,rgba(255,60,172,.10),transparent 28%),
    linear-gradient(180deg,#070b12,#09121e);
}
.track-card{
  width:100%;
  max-width:520px;
  background:linear-gradient(145deg,rgba(16,28,44,.96),rgba(8,17,28,.97));
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  box-shadow:0 20px 55px rgba(0,0,0,.42),0 0 34px rgba(248,190,3,.08);
}
.track-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.track-kicker{font-size:10px;color:var(--cyan);font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.track-title{font-size:22px;margin:4px 0 0;color:#fff}
.track-code{
  font-family:"IBM Plex Mono",monospace;
  font-size:13px;color:#9db0c5;margin:4px 0 0
}
.track-live{
  padding:7px 10px;border-radius:999px;background:rgba(248,190,3,.09);
  border:1px solid rgba(248,190,3,.25);color:var(--cyan);font-size:10px;font-weight:900;
  animation:pulse 2s infinite;
}
.track-current{
  margin:18px 0;
  padding:14px;
  border:1px solid rgba(248,190,3,.18);
  border-radius:16px;
  background:rgba(248,190,3,.045);
}
.track-current-label{font-size:10px;color:#7f93ab;text-transform:uppercase;font-weight:800}
.track-current-status{font-family:Orbitron,system-ui,sans-serif;font-size:20px;color:#fff;margin-top:5px}
.track-steps{margin-top:18px}
.track-step{
  display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:22px;
}
.track-step:last-child{padding-bottom:0}
.track-step:not(:last-child):before{
  content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:#1b2c3e
}
.track-step.done:not(:last-child):before,
.track-step.active:not(:last-child):before{
  background:linear-gradient(180deg,var(--cyan),rgba(248,190,3,.2));
}
.track-dot{
  width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:#0c1725;border:1px solid var(--line);color:#61758c;font-size:12px;font-weight:900;z-index:1
}
.track-step.done .track-dot{
  color:#031218;background:linear-gradient(135deg,var(--cyan),#C98A00);
  border-color:transparent;box-shadow:0 0 18px rgba(248,190,3,.22)
}
.track-step.active .track-dot{
  color:#031218;background:linear-gradient(135deg,var(--lime),#76d92e);
  border-color:transparent;box-shadow:0 0 22px rgba(183,255,74,.2);
  animation:cartPop .65s ease-in-out infinite alternate
}
.track-step-title{font-weight:800;color:#fff;margin:2px 0 3px}
.track-step-sub{font-size:11px;color:#7f93ab;line-height:1.45}
.track-footer{
  margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06);
  display:flex;gap:8px;flex-wrap:wrap
}
.track-btn{
  flex:1;min-width:140px;padding:11px 13px;border-radius:12px;font-size:12px;font-weight:900;
  background:#13263a;color:#fff;border:1px solid var(--line)
}
.track-btn.primary{
  background:linear-gradient(90deg,var(--cyan),#C98A00);color:#031218;border-color:transparent
}

.confirm-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-card{max-width:400px;width:100%;text-align:center}
.checkcircle{width:82px;height:82px;border-radius:24px;background:linear-gradient(135deg,var(--cyan),#C98A00);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 35px rgba(248,190,3,.25)}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;margin-bottom:24px}
.receipt-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.receipt-total{display:flex;justify-content:space-between;padding-top:10px;margin-top:8px;border-top:1px dashed var(--line);font-weight:700}
.newbtn{background:#15253a;color:#fff;font-weight:700;padding:12px 24px;border-radius:13px;border:1px solid var(--line)}

.pin-wrap{min-height:100vh;background:radial-gradient(circle at 50% 20%,rgba(248,190,3,.12),transparent 35%),#070b12;display:flex;align-items:center;justify-content:center;padding:24px}
.pin-card{max-width:310px;width:100%;text-align:center}
.backlink{display:flex;align-items:center;gap:4px;color:#8ea0b8;font-size:13px;background:none;margin-bottom:32px}
.lockcircle{width:62px;height:62px;border-radius:18px;background:rgba(248,190,3,.08);border:1px solid rgba(248,190,3,.2);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;box-shadow:var(--glow)}
.pin-card h2{color:#fff;font-size:23px;margin:0 0 5px}.pin-card p{color:#8295ad;font-size:13px;margin:0 0 24px}
.pin-input{width:100%;text-align:center;font-size:24px;letter-spacing:.5em;padding:13px;border-radius:13px;background:#0c1725;color:#fff;border:1px solid var(--line);outline:none;margin-bottom:12px}
.pin-input.err{border-color:var(--danger)}.pin-err{color:var(--danger)!important;font-size:13px!important;margin:0 0 12px!important}
.unlockbtn{width:100%;background:linear-gradient(90deg,var(--cyan),#C98A00);color:#031218;font-weight:900;padding:13px;border-radius:13px}

.admin-head{background:rgba(8,14,23,.95);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;backdrop-filter:blur(15px)}
.admin-head h1{color:#fff;font-size:16px;margin:0}.exitbtn{color:#8ea0b8;font-size:12px;background:none;display:flex;align-items:center;gap:4px}
.admin-body{max-width:1080px;margin:0 auto;padding:16px 12px 30px}
.tabs{display:flex;gap:7px;margin-bottom:18px;overflow:auto}.tab{font-size:12px;padding:9px 13px;border-radius:10px;background:#0d1827;color:#91a3ba;border:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}.tab.active{background:rgba(248,190,3,.1);color:var(--cyan);border-color:rgba(248,190,3,.35)}
.badge{padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800;color:#fff}
.orders-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.orders-grid{grid-template-columns:1fr 1fr}.menu-wrap{padding-left:18px;padding-right:18px}}
@media(min-width:960px){.orders-grid{grid-template-columns:1fr 1fr 1fr}}

/* KOT / POS */
.kot-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.kot-grid{grid-template-columns:1fr 1fr}}
.kot-card{
  background:linear-gradient(145deg,rgba(18,29,45,.96),rgba(8,17,28,.96));
  border:1px solid rgba(255,165,0,.22);border-radius:18px;padding:15px;
  box-shadow:0 10px 28px rgba(0,0,0,.2);
}
.kot-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:11px}
.kot-code{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:800;margin:0;color:#fff}
.kot-meta{font-size:11px;color:#7f93ab;margin:3px 0 0}
.kot-label{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;background:rgba(255,165,0,.1);color:#ffb24d;border:1px solid rgba(255,165,0,.25)}
.kot-items{border-top:1px dashed rgba(255,255,255,.09);border-bottom:1px dashed rgba(255,255,255,.09);padding:10px 0;margin:8px 0}
.kot-item{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px}
.kot-item strong{color:#fff}
.kot-note{font-size:11px;color:#ffb24d;margin-top:7px}
.kot-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.kot-btn{
  padding:8px 11px;border-radius:10px;font-size:11px;font-weight:900;
  background:#14263a;color:#fff;border:1px solid var(--line)
}
.kot-btn.primary{background:linear-gradient(90deg,var(--cyan),#C98A00);color:#031218;border-color:transparent}
.kot-btn.success{background:linear-gradient(90deg,#8cff66,var(--lime));color:#071009;border-color:transparent}

.pos-shell{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.pos-shell{grid-template-columns:1.2fr .8fr}}
.pos-panel{
  background:linear-gradient(145deg,rgba(18,29,45,.96),rgba(9,17,28,.96));
  border:1px solid var(--line);border-radius:18px;padding:15px;
}
.pos-title{font-size:14px;font-weight:900;margin:0 0 12px}
.pos-order-card{padding:12px;border:1px solid rgba(255,255,255,.06);border-radius:13px;margin-bottom:8px;background:rgba(255,255,255,.02)}
.pos-order-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pos-order-total{font-family:"IBM Plex Mono",monospace;color:var(--lime);font-weight:900}
.pos-pay-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pos-pay-btn{
  padding:10px;border-radius:10px;background:#0f2033;color:#aebed0;border:1px solid var(--line);
  font-size:11px;font-weight:800
}
.pos-pay-btn.active{background:rgba(248,190,3,.11);border-color:rgba(248,190,3,.4);color:var(--cyan)}
.pos-paid{
  display:inline-flex;padding:5px 8px;border-radius:999px;background:rgba(183,255,74,.09);
  color:var(--lime);font-size:10px;font-weight:900;border:1px solid rgba(183,255,74,.2)
}
.pos-unpaid{
  display:inline-flex;padding:5px 8px;border-radius:999px;background:rgba(255,85,119,.08);
  color:#ff7793;font-size:10px;font-weight:900;border:1px solid rgba(255,85,119,.2)
}
.pos-receipt{

<script>
/* ---------------- realtime ---------------- */
// If this file is opened directly (file://) instead of via the running
// server, /socket.io/socket.io.js won't load and `io` won't exist.
// Fall back to a no-op stub so the app still renders in local-only mode
// instead of crashing with a blank page.
const socket = (typeof io === "function") ? io() : {
  on(){}, emit(){}, connected:false
};
let realtimeConnected = false;
socket.on("connect",()=>{
  realtimeConnected=true;
  socket.emit("orders:request");
  socket.emit("menu:request");
  if(state.staffToken && !state.staffUser){
    socket.emit("staff:whoami", {token: state.staffToken}, (res)=>{
      if(res && res.ok){ state.staffUser = res.user; if(state.view==="admin") render(); }
      else { state.staffToken = null; localStorage.removeItem("jb_staff_token"); if(state.view==="admin"){ state.view="pin"; render(); } }
    });
  }
});
socket.on("disconnect",()=>{ realtimeConnected=false; });
socket.on("orders:snapshot",(orders)=>{ state.orders = orders || []; syncTrackedOrder(); render(); });
socket.on("order:update",(order)=>{ upsertRealtimeOrder(order); });
socket.on("orders:updated",(orders)=>{ state.orders = orders || []; syncTrackedOrder(); render(); });

// The server is the source of truth for the menu once this device has
// synced. If the server has nothing yet (a brand-new database) but this
// browser has a customized menu cached locally (e.g. items with real
// photos added via the Menu editor), push that local copy up once so
// every device — including ones that never touched this browser's
// storage — sees the same menu going forward.
let menuSyncedFromServer = false;
socket.on("menu:snapshot",(menu)=>{
  if(Array.isArray(menu) && menu.length){
    state.menu = menu;
    localStorage.setItem("jb_menu", JSON.stringify(menu));
    localStorage.setItem("jb_menu_version", String(MENU_VERSION));
    menuSyncedFromServer = true;
    render();
  } else if(!menuSyncedFromServer && realtimeConnected){
    // Server has no menu yet — seed it from whatever this browser has
    // locally (this is the one-time migration for the counter PC).
    menuSyncedFromServer = true;
    socket.emit("menu:update", state.menu);
  }
});

function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function loadMenu(){
  try{
    const storedVersion = Number(localStorage.getItem("jb_menu_version") || 0);
    if(storedVersion !== MENU_VERSION){
      // The bundled menu catalog changed since this browser last cached
      // one (e.g. new items/categories shipped) — reset to the new
      // default menu instead of showing a stale, category-mismatched cache.
      localStorage.setItem("jb_menu", JSON.stringify(DEFAULT_MENU));
      localStorage.setItem("jb_menu_version", String(MENU_VERSION));
      return JSON.parse(JSON.stringify(DEFAULT_MENU));
    }
    const v = localStorage.getItem("jb_menu");
    return v ? JSON.parse(v) : DEFAULT_MENU;
  }catch(e){ return DEFAULT_MENU; }
}
function saveMenu(){
  localStorage.setItem("jb_menu", JSON.stringify(state.menu));
  localStorage.setItem("jb_menu_version", String(MENU_VERSION));
}
/* ---------------- category order ----------------
   Category display order used to be a hardcoded constant (CATEGORY_ORDER).
   Staff can now reorder categories from the Menu editor, so the actual
   order is persisted separately and merged with whatever categories are
   currently present in the menu (new/renamed categories get appended). */
const CATEGORY_ORDER_KEY = "jb_category_order";
function getCategoryOrder(menu){
  const present = [...new Set((menu||[]).map(m=>m.category))];
  let stored = null;
  try{
    const v = localStorage.getItem(CATEGORY_ORDER_KEY);
    stored = v ? JSON.parse(v) : null;
  }catch(e){ stored = null; }
  const base = (Array.isArray(stored) && stored.length) ? stored : CATEGORY_ORDER;
  const ordered = base.filter(c=>present.includes(c));
  present.forEach(c=>{ if(!ordered.includes(c)) ordered.push(c); });
  return ordered;
}
function saveCategoryOrder(order){
  try{ localStorage.setItem(CATEGORY_ORDER_KEY, JSON.stringify(order)); }catch(e){}
}
function saveOrders(){ localStorage.setItem("jb_orders", JSON.stringify(state.orders)); }

function upsertRealtimeOrder(order){
  if(!order || !order.id) return;
  const idx = state.orders.findIndex(x=>x.id===order.id);
  if(idx === -1) state.orders.push(order);
  else state.orders[idx] = order;
  if(state.trackingOrderId === order.id){
    state.confirmed = order;
  }
  // Keep customer tracking visible while the backend changes status.
  if(state.confirmed && state.trackingOrderId === order.id){
    render();
  } else if(state.view === "admin" || state.view === "order"){
    render();
  }
  localStorage.setItem("jb_orders", JSON.stringify(state.orders));
}

function syncToServer(order){
  return new Promise((resolve,reject)=>{
    if(!realtimeConnected){
      reject(new Error("Realtime server is not connected."));
      return;
    }
    socket.emit("order:create", order, (result)=>{
      if(result && result.ok) resolve(result.order);
      else reject(new Error(result?.error || "Could not create order."));
    });
  });
}
function updateServerOrderStatus(id,status){
  if(!realtimeConnected) return;
  socket.emit("order:status",{id,status});
}
function updateServerPayment(id,method){
  if(!realtimeConnected) return;
  socket.emit("order:payment",{id,method});
}
function createServerOrder(order){
  if(!realtimeConnected) return;
  socket.emit("order:create", order);
}

function posChangeQty(item, delta){
  if(!state.posNewOrder) return;
  const cart = state.posNewOrder.cart;
  const idx = cart.findIndex(c=>c.id===item.id);
  if(idx === -1){ if(delta>0) cart.push({id:item.id,name:item.name,price:item.price,qty:1}); }
  else{
    const q = cart[idx].qty + delta;
    if(q<=0) cart.splice(idx,1); else cart[idx].qty = q;
  }
  render();
}
function posCartSubtotal(){
  if(!state.posNewOrder) return 0;
  return state.posNewOrder.cart.reduce((s,c)=>s+c.price*c.qty,0);
}
function submitPOSOrder(){
  if(!state.posNewOrder || state.posNewOrder.cart.length===0) return;
  const subtotal = posCartSubtotal();
  const discountType = state.posNewOrder.discountType || "";
  const discountValue = discountType ? Number(state.posNewOrder.discountValue)||0 : 0;
  const order = {
    id: newId(),
    items: state.posNewOrder.cart,
    notes: (state.posNewOrder.notes||"").trim(),
    customerName: (state.posNewOrder.customerName||"").trim(),
    customerPhone: (state.posNewOrder.phone||"").trim(),
    subtotal,
    discountType,
    discountValue,
    discountAmount: discountType ? discountAmountFor(subtotal, discountType, discountValue) : 0,
    total: posCartFinalTotal(),
    status: "pending",
    createdAt: Date.now(),
    paymentStatus: "unpaid"
  };
  state.orders.push(order);
  saveOrders();
  createServerOrder(order);
  state.posNewOrder = null;
  render();
}

/* ---------------- cart helpers ---------------- */
function qtyOf(id){ const c = state.cart.find(c=>c.id===id); return c ? c.qty : 0; }
function changeQty(item, delta){
  const idx = state.cart.findIndex(c=>c.id===item.id);
  if(idx === -1){ if(delta>0) state.cart.push({id:item.id,name:item.name,price:item.price,qty:1}); }
  else{
    const q = state.cart[idx].qty + delta;
    if(q<=0) state.cart.splice(idx,1); else state.cart[idx].qty = q;
  }
  // Trigger a short futuristic "added to cart" animation on positive taps,
  // and a distinct "removed" pulse on negative taps — so both + and -
  // give clear, visible feedback instead of just the number quietly changing.
  state.addedItemId = delta > 0 ? item.id : null;
  state.removedItemId = delta < 0 ? item.id : null;
  state.addedToken = Date.now();
  render();
  if(delta > 0){
    setTimeout(()=>{
      if(state.addedItemId === item.id){ state.addedItemId = null; render(); }
    }, 650);
  }
  if(delta < 0){
    setTimeout(()=>{
      if(state.removedItemId === item.id){ state.removedItemId = null; render(); }
    }, 450);
  }
}
function cartSubtotal(){ return state.cart.reduce((s,c)=>s+c.price*c.qty,0); }
function cartCount(){ return state.cart.reduce((s,c)=>s+c.qty,0); }

/* ---------------- membership discount helpers ---------------- */
function discountAmountFor(subtotal, discountType, discountValue){
  subtotal = Number(subtotal)||0;
  const dv = Number(discountValue)||0;
  if(discountType==="percent") return Math.round(subtotal * Math.min(Math.max(dv,0),100) / 100 * 100)/100;
  if(discountType==="amount") return Math.round(Math.min(Math.max(dv,0), subtotal) * 100)/100;
  return 0;
}
function discountLabel(discountType, discountValue){
  if(discountType==="percent") return `${Number(discountValue)}% off`;
  if(discountType==="amount") return `${money(discountValue)} off`;
  return "";
}
// Debounced member lookup shared by the customer checkout and POS drawer.
let memberLookupTimer = null;
function lookupMember(phone, cb){
  clearTimeout(memberLookupTimer);
  const p = String(phone||"").trim();
  if(!p){ cb(null); return; }
  memberLookupTimer = setTimeout(()=>{
    if(!realtimeConnected){ return; }
    socket.emit("member:lookup", {phone:p}, (res)=>{
      cb(res && res.ok ? res.member : null);
    });
  }, 350);
}
function cartDiscountAmount(){
  if(!state.tmpMember) return 0;
  return discountAmountFor(cartSubtotal(), state.tmpMember.discountType, state.tmpMember.discountValue);
}
function cartFinalTotal(){ return Math.max(0, cartSubtotal() - cartDiscountAmount()); }

function posCartDiscountAmount(){
  if(!state.posNewOrder || !state.posNewOrder.discountType) return 0;
  return discountAmountFor(posCartSubtotal(), state.posNewOrder.discountType, state.posNewOrder.discountValue);
}
function posCartFinalTotal(){ return Math.max(0, posCartSubtotal() - posCartDiscountAmount()); }

function bindOrderEvents(){
  const resumeTrackingBtn = document.getElementById("resumeTrackingBtn");
  if(resumeTrackingBtn) resumeTrackingBtn.onclick=()=>{
    const tracked = state.orders.find(x=>x.id===state.trackingOrderId);
    if(tracked){
      state.confirmed = tracked;
      render();
    }
  };

  root.querySelectorAll('[data-action="goCat"]').forEach(el=>el.onclick=()=>{
    state.activeCat = el.dataset.cat; render();
    setTimeout(()=>{ const t=document.getElementById("cat-"+el.dataset.cat.replace(/\s+/g,'-')); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); },0);
  });
  root.querySelectorAll('[data-action="add"]').forEach(el=>el.onclick=()=>{
    const item = state.menu.find(m=>m.id===el.dataset.id);
    changeQty(item,1);
  });
  root.querySelectorAll('[data-action="sub"]').forEach(el=>el.onclick=()=>{
    const item = state.menu.find(m=>m.id===el.dataset.id) || state.cart.find(c=>c.id===el.dataset.id);
    changeQty(item,-1);
  });
  const staffBtn = root.querySelector('[data-action="openStaff"]');
  if(staffBtn) staffBtn.onclick=()=>{ state.view = state.staffUser ? "admin" : "pin"; render(); };
  const fixedCheckoutBtn = document.getElementById("fixedCheckoutBtn");
  if(fixedCheckoutBtn) fixedCheckoutBtn.onclick=()=>{ state.showCart=true; render(); };

  const cupBtn = document.getElementById("cupBtn");
  if(cupBtn) cupBtn.onclick=()=>{ state.showCart=true; render(); };
  const overlay = document.getElementById("cartOverlay");
  if(overlay) overlay.onclick=(e)=>{ if(e.target===overlay){ state.showCart=false; render(); } };
  const closeBtn = root.querySelector('[data-action="closeCart"]');
  if(closeBtn) closeBtn.onclick=()=>{ state.showCart=false; render(); };
  const nameInp = document.getElementById("custName");
  if(nameInp) nameInp.oninput=(e)=>{ state.tmpName = e.target.value; };
  const phoneInp = document.getElementById("custPhone");
  if(phoneInp) phoneInp.oninput=(e)=>{
    state.tmpPhone = e.target.value;
    const phone = state.tmpPhone;
    lookupMember(phone, (member)=>{
      if(state.tmpPhone !== phone) return; // input changed again while we waited
      state.tmpMember = member;
      state.tmpMemberChecked = phone;
      render();
    });
  };
  const notesInp = document.getElementById("custNotes");
  if(notesInp) notesInp.oninput=(e)=>{ state.tmpNotes = e.target.value; };
  const placeBtn = document.getElementById("placeBtn");
  if(placeBtn) placeBtn.onclick=placeOrder;
}

async function placeOrder(){
  if(state.cart.length===0) return;
  state.placing = true; render();
  const subtotal = cartSubtotal();
  const member = state.tmpMember;
  const order = {
    id: newId(),
    items: state.cart,
    notes: state.tmpNotes||"",
    customerName: (state.tmpName||"").trim(),
    customerPhone: (state.tmpPhone||"").trim(),
    subtotal,
    discountType: member ? member.discountType : "",
    discountValue: member ? member.discountValue : 0,
    discountAmount: member ? discountAmountFor(subtotal, member.discountType, member.discountValue) : 0,
    total: cartFinalTotal(),
    status: "pending",
    createdAt: Date.now(),
    paymentStatus: "unpaid"
  };
  state.orders.push(order);
  saveOrders();
  state.confirmed = order;
  state.trackingOrderId = order.id;
  state.cart = [];
  state.showCart = false;
  state.tmpName = ""; state.tmpNotes = ""; state.tmpPhone = ""; state.tmpMember = null; state.tmpMemberChecked = "";
  state.syncError = null;

  try{
    // Push the order to the server so it reaches the kitchen (KOT) and
    // billing (POS) dashboards in realtime, and gets saved to MongoDB.
    const serverOrder = await syncToServer(order);
    const idx = state.orders.findIndex(o=>o.id===order.id);
    if(idx !== -1) state.orders[idx] = serverOrder;
    if(state.confirmed && state.confirmed.id === order.id) state.confirmed = serverOrder;
    saveOrders();
  }catch(err){
    // Order is still saved locally and the customer still sees their
    // confirmation screen — but staff won't see it until this device
    // reconnects. Flag it so the tracking screen can tell the customer.
    console.error("Could not sync order to server:", err.message);
    state.syncError = "Your order was saved on this device but hasn't reached the counter yet — please also let a staff member know.";
  }

  state.placing = false;
  render();
}

  [userInput,passInput].forEach(inp=>{
    inp.oninput=()=>{ state.pinError=false; };
    inp.onkeydown=(e)=>{ if(e.key==="Enter") tryLogin(); };
  });
  document.getElementById("unlockBtn").onclick=tryLogin;
  userInput.focus();
  function tryLogin(){
    const username = userInput.value.trim();
    const password = passInput.value;
    if(!username || !password){ state.pinError="Enter your username and password."; render(); return; }
    if(!realtimeConnected){ state.pinError="Not connected to the server yet — wait a moment and try again."; render(); return; }
    socket.emit("staff:login", {username, password}, (res)=>{
      if(res && res.ok){
        state.staffUser = res.user;
        state.staffToken = res.token;
        localStorage.setItem("jb_staff_token", res.token);
        state.pinError=false;
        state.view="admin";
        state.adminTab="orders";
        render();
      }else{
        state.pinError = (res && res.error) || "Login failed.";
        render();
      }
    });
  }
}

function printKOT(id){
  const o = state.orders.find(x=>x.id===id);
  if(!o) return;
  const itemRows = o.items.map(it=>`
    <tr><td style="padding:6px 0">${it.qty} × ${esc(it.name)}</td><td style="text-align:right">${esc(o.notes||"")}</td></tr>
  `).join("");
  const popup = window.open("", "_blank", "width=420,height=650");
  if(!popup) return;
  popup.document.write(`
    <html><head><title>KOT #${orderCode(o.id)}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:18px;color:#111}
      h1{text-align:center;font-size:22px;margin:0 0 6px}
      p{margin:4px 0;font-size:13px}
      hr{border:0;border-top:1px dashed #111;margin:12px 0}
      table{width:100%;border-collapse:collapse;font-size:14px}
      .big{font-size:28px;font-weight:800;text-align:center}
    </style></head><body>
      <h1>THE JUICE BAR</h1>
      <div class="big">KOT #${orderCode(o.id)}</div>
      <p><b>Time:</b> ${formatTime(o.createdAt)}</p>
      ${o.customerName?`<p><b>Customer:</b> ${esc(o.customerName)}</p>`:""}
      <hr>
      <table>${itemRows}</table>
      ${o.notes?`<hr><p><b>Note:</b> ${esc(o.notes)}</p>`:""}
      <hr>
      <p style="text-align:center;font-weight:700">KITCHEN COPY</p>
    </body></html>
  `);
  popup.document.close();
  popup.focus();
  setTimeout(()=>popup.print(),250);
}
function printPOSReceipt(id){
  const o = state.orders.find(x=>x.id===id);
  if(!o) return;
  const rows = o.items.map(it=>`
    <tr><td>${it.qty} × ${esc(it.name)}</td><td style="text-align:right">৳${Number(it.price*it.qty).toFixed(0)}</td></tr>
  `).join("");
  const popup = window.open("", "_blank", "width=420,height=700");
  if(!popup) return;
  popup.document.write(`
    <html><head><title>Receipt #${orderCode(o.id)}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:18px;color:#111}
      h1{text-align:center;font-size:20px;margin:0}
      .code{text-align:center;font-size:24px;font-weight:800;margin:8px 0}
      table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
      td{padding:5px 0}
      .total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;border-top:1px dashed #111;padding-top:10px;margin-top:8px}
      p{font-size:12px;text-align:center;margin:8px 0}
    </style></head><body>
      <h1>THE JUICE BAR</h1>
      <div class="code">Receipt #${orderCode(o.id)}</div>
      <p>${formatTime(o.createdAt)}${o.customerName?` • ${esc(o.customerName)}`:""}</p>
      <table>${rows}</table>
      ${o.discountAmount>0?`
      <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:8px;"><span>Subtotal</span><span>৳${Number(o.subtotal!=null?o.subtotal:o.total).toFixed(0)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;"><span>Discount</span><span>-৳${Number(o.discountAmount).toFixed(0)}</span></div>`:""}
      <div class="total"><span>Total</span><span>৳${Number(o.total).toFixed(0)}</span></div>
      <p>Payment: ${esc(o.paymentMethod || "Counter")}</p>
      <p>Thank you!</p>
    </body></html>
  `);
  popup.document.close();
  popup.focus();
  setTimeout(()=>popup.print(),250);
}

function renderKOTTab(tc){

  tc.innerHTML = `

      <span class="kot-label">KITCHEN DISPLAY</span>
      <button class="pill" id="kotRefresh">Refresh</button>
    </div>
    ${kitchenOrders.length===0 ? `<div class="kot-empty">No active kitchen tickets.</div>` : `
      <div class="kot-grid">
        ${kitchenOrders.map(o=>{
          const next = o.status==="pending" ? "preparing" : (o.status==="preparing" ? "ready" : "completed");
          return `
          <div class="kot-card">
            <div class="kot-head">
              <div>
                <p class="kot-code">KOT #${orderCode(o.id)}</p>
                <p class="kot-meta">${formatTime(o.createdAt)}${o.customerName?` • ${esc(o.customerName)}`:""}</p>
              </div>

    const createBtn = document.getElementById("posCreateOrderBtn");
    if(createBtn) createBtn.onclick=submitPOSOrder;

/* Keep categoryOrderDraft in sync with whatever categories actually exist
   in the draft (items get added/removed, which can add or remove a
   category). Preserves the relative order staff already set. */
function syncCategoryOrderDraft(){
  const present = [...new Set(state.menuDraft.map(m=>m.category))];
  state.categoryOrderDraft = (state.categoryOrderDraft||[]).filter(c=>present.includes(c));
  present.forEach(c=>{ if(!state.categoryOrderDraft.includes(c)) state.categoryOrderDraft.push(c); });
}
/* Move a category up (dir=-1) or down (dir=+1) in categoryOrderDraft. */
function moveCategoryDraft(cat, dir){
  const order = state.categoryOrderDraft;
  const i = order.indexOf(cat);
  const j = i + dir;
  if(i===-1 || j<0 || j>=order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  state.menuDirty = true;
}
/* Move an item up (dir=-1) or down (dir=+1) within its own category,
   by swapping its position with its neighbor's inside state.menuDraft. */
function moveMenuItemDraft(id, dir){
  const draft = state.menuDraft;
  const item = draft.find(m=>m.id===id);
  if(!item) return;
  const sameCatIdxs = [];
  draft.forEach((m,i)=>{ if(m.category===item.category) sameCatIdxs.push(i); });
  const pos = sameCatIdxs.indexOf(draft.indexOf(item));
  const targetPos = pos + dir;
  if(pos===-1 || targetPos<0 || targetPos>=sameCatIdxs.length) return;
  const i1 = sameCatIdxs[pos], i2 = sameCatIdxs[targetPos];
  [draft[i1], draft[i2]] = [draft[i2], draft[i1]];
  state.menuDirty = true;
}

              </div>
              <div class="edit-thumb">${item.image ? `<img src="${esc(item.image)}" alt="">` : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mute)" stroke-width="1.8"><path d="M12 2 C6 6 6 14 12 22 C18 14 18 6 12 2 Z"/></svg>`}</div>
              <input type="text" data-f="name" value="${esc(item.name)}" style="flex:1;min-width:120px;">
              <input type="text" data-f="desc" value="${esc(item.desc)}" style="flex:1;min-width:140px;color:var(--mute);">
              <input type="number" step="0.25" data-f="price" value="${item.price}" style="width:80px;">
              <input type="text" data-f="image" value="${esc(item.image||'')}" placeholder="Image URL" style="width:130px;">
              <label class="upload-label">Upload<input type="file" accept="image/*" data-upload="${item.id}" style="display:none;"></label>
              <label class="stockLabel"><input type="checkbox" data-f="available" ${item.available?"checked":""}> In stock</label>
              <button data-del="${item.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 6"/></svg></button>
            </div>
          `).join("")}
        </div>
      `;}).join("")}
      <div class="addbox">
        <p>Add a new item</p>
        <div class="addrow">
          <input type="text" id="newName" placeholder="Name" style="flex:1;min-width:120px;">
          <input type="text" id="newDesc" placeholder="Description" style="flex:1;min-width:140px;">
          <input type="number" id="newPrice" step="0.25" placeholder="Price" style="width:80px;">
          <input type="text" id="newImage" placeholder="Image URL (optional)" style="width:150px;">
          <input type="text" id="newCat" list="catlist" placeholder="Category" value="${esc(cats[0]||'')}" style="width:160px;">
          <datalist id="catlist">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
          <button class="addgo" id="addItemBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg> Add</button>
        </div>
      </div>
    </div>
  `;

  tc.querySelectorAll(".edit-item").forEach(row=>{
    const id = row.dataset.id;
    row.querySelectorAll("[data-f]").forEach(input=>{
      input.onchange=()=>{
        const item = state.menuDraft.find(m=>m.id===id);
        const f = input.dataset.f;
        if(f==="price") item.price = parseFloat(input.value)||0;
        else if(f==="available") item.available = input.checked;
        else item[f] = input.value;
        state.menuDirty = true;
        renderMenuEditor(tc);
      };
    });
  });
  tc.querySelectorAll("[data-del]").forEach(btn=>btn.onclick=()=>{
    state.menuDraft = state.menuDraft.filter(m=>m.id!==btn.dataset.del);
    state.menuDirty = true;
    renderMenuEditor(tc);
  });
  tc.querySelectorAll("[data-catmove]").forEach(btn=>btn.onclick=()=>{
    moveCategoryDraft(btn.dataset.catmove, Number(btn.dataset.dir));
    renderMenuEditor(tc);
  });
  tc.querySelectorAll("[data-itemmove]").forEach(btn=>btn.onclick=()=>{
    moveMenuItemDraft(btn.dataset.itemmove, Number(btn.dataset.dir));
    renderMenuEditor(tc);
  });
  tc.querySelectorAll("[data-upload]").forEach(fileInput=>{
    fileInput.onchange=()=>{
      const file = fileInput.files[0];
      if(!file) return;
      if(file.size > 800*1024){
        alert("That photo is a bit large for browser storage — try one under ~800KB, or paste an image URL instead.");
        return;
      }
      const reader = new FileReader();
      reader.onload = ()=>{
        const item = state.menuDraft.find(m=>m.id===fileInput.dataset.upload);
        item.image = reader.result;
        state.menuDirty = true;
        renderMenuEditor(tc);
      };
      reader.readAsDataURL(file);
    };
  });
  const addBtn = document.getElementById("addItemBtn");
  if(addBtn) addBtn.onclick=()=>{
    const name = document.getElementById("newName").value.trim();
    const price = parseFloat(document.getElementById("newPrice").value)||0;
    if(!name || !price) return;
    state.menuDraft.push({
      id:newId(),
      category: document.getElementById("newCat").value.trim() || cats[0] || CATEGORY_ORDER[0],
      name, desc: document.getElementById("newDesc").value.trim(), price,
      image: document.getElementById("newImage").value.trim(), available:true
    });
    state.menuDirty = true;
    renderMenuEditor(tc);
  };
  const saveBtn = document.getElementById("saveMenuBtn");
  if(saveBtn) saveBtn.onclick=()=>{
    state.menu = state.menuDraft;
    saveCategoryOrder(state.categoryOrderDraft);
    saveMenu();
    // Push to the server so every other device (customer phones, other
    // staff devices, Railway) sees this update in realtime too.
    if(realtimeConnected) socket.emit("menu:update", state.menu);
    state.menuDirty = false;
    render();
  };
}

function renderMembersTab(tc){
  tc.innerHTML = `
    <div class="addbox" style="margin-top:0;margin-bottom:18px;">
      <p>Register a new member</p>
      <div class="addrow">
        <input type="text" id="newMemberName" placeholder="Customer name (optional)" style="flex:1;min-width:120px;">
        <input type="tel" id="newMemberPhone" placeholder="Phone number" style="flex:1;min-width:140px;" autocomplete="off">
        <select id="newMemberDiscountType" style="border:1px solid var(--line);background:#08121f;color:#fff;border-radius:8px;padding:7px 8px;font-size:12px;">
          <option value="percent">% off</option>
          <option value="amount">৳ off</option>
        </select>
        <input type="number" min="0" id="newMemberDiscountValue" placeholder="Discount" style="width:90px;">
        <button class="addgo" id="createMemberBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg> Add</button>
      </div>
      ${state.memberFormError ? `<p style="color:var(--danger);font-size:12px;margin:10px 0 0;">${esc(state.memberFormError)}</p>` : ""}
    </div>
    <div id="memberListWrap">${renderMemberListHTML()}</div>
  `;

  const createBtn = document.getElementById("createMemberBtn");
  createBtn.onclick=()=>{
    const name = document.getElementById("newMemberName").value.trim();
    const phone = document.getElementById("newMemberPhone").value.trim();
    const discountType = document.getElementById("newMemberDiscountType").value;
    const discountValue = document.getElementById("newMemberDiscountValue").value;
    if(!phone){ state.memberFormError="A phone number is required."; renderMembersTab(tc); return; }
    if(discountValue===""||Number(discountValue)<0){ state.memberFormError="Enter a valid discount value."; renderMembersTab(tc); return; }
    socket.emit("member:create", {token: state.staffToken, phone, name, discountType, discountValue}, (res)=>{
      if(res && res.ok){
        state.memberFormError = null;
        loadMemberList(tc);
      }else{
        state.memberFormError = (res && res.error) || "Could not add member.";
        renderMembersTab(tc);
      }
    });
  };

  loadMemberList(tc);
}

function renderMemberListHTML(){
  if(!state.memberList) return `<p style="color:var(--muted);font-size:13px;">Loading members…</p>`;
  if(!state.memberList.length) return `<p style="color:var(--muted);font-size:13px;">No members registered yet.</p>`;
  return state.memberList.map(m=>{
    const editing = state.editingMemberPhone === m.phone;
    if(editing){
      return `
      <div class="edit-item" data-phone="${esc(m.phone)}">
        <input type="text" data-editname placeholder="Name" value="${esc(m.name||"")}" style="flex:1;min-width:100px;">
        <select data-edittype style="border:1px solid var(--line);background:#08121f;color:#fff;border-radius:8px;padding:7px 8px;font-size:12px;">
          <option value="percent" ${m.discountType==="percent"?"selected":""}>% off</option>
          <option value="amount" ${m.discountType==="amount"?"selected":""}>৳ off</option>
        </select>
        <input type="number" min="0" data-editvalue value="${m.discountValue}" style="width:80px;">
        <button class="upload-label" data-savemember="${esc(m.phone)}">Save</button>
        <button class="upload-label" data-canceleditmember="${esc(m.phone)}">Cancel</button>
      </div>`;
    }
    return `
    <div class="edit-item" data-phone="${esc(m.phone)}">
      <div style="flex:1;min-width:120px;">
        <div style="font-weight:700;font-size:13px;">${esc(m.name||"Unnamed")}</div>
        <div class="mono" style="color:var(--muted);font-size:11px;">${esc(m.phone)} · ${discountLabel(m.discountType,m.discountValue)}</div>
      </div>
      <button class="upload-label" data-editmember="${esc(m.phone)}">Edit</button>
      <button data-delmember="${esc(m.phone)}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 6"/></svg></button>
    </div>`;
  }).join("");
}

function loadMemberList(tc){
  socket.emit("member:list", {token: state.staffToken}, (res)=>{
    state.memberList = (res && res.ok) ? res.members : [];
    const wrap = document.getElementById("memberListWrap");
    if(wrap){
      wrap.innerHTML = renderMemberListHTML();
      wireMemberListEvents(tc);
    }
  });
}

function wireMemberListEvents(tc){
  document.querySelectorAll("[data-editmember]").forEach(btn=>{
    btn.onclick=()=>{ state.editingMemberPhone = btn.dataset.editmember; loadMemberList(tc); };
  });
  document.querySelectorAll("[data-canceleditmember]").forEach(btn=>{
    btn.onclick=()=>{ state.editingMemberPhone = null; loadMemberList(tc); };
  });
  document.querySelectorAll("[data-savemember]").forEach(btn=>{
    btn.onclick=()=>{
      const row = btn.closest("[data-phone]");
      const name = row.querySelector("[data-editname]").value.trim();
      const discountType = row.querySelector("[data-edittype]").value;
      const discountValue = row.querySelector("[data-editvalue]").value;
      if(discountValue===""||Number(discountValue)<0){ alert("Enter a valid discount value."); return; }
      socket.emit("member:update", {token: state.staffToken, phone: btn.dataset.savemember, name, discountType, discountValue}, (res)=>{
        if(res && res.ok){ state.editingMemberPhone = null; loadMemberList(tc); }
        else alert((res && res.error) || "Could not update member.");
      });
    };
  });
  document.querySelectorAll("[data-delmember]").forEach(btn=>{
    btn.onclick=()=>{
      if(!confirm(`Remove member "${btn.dataset.delmember}"?`)) return;
      socket.emit("member:delete", {token: state.staffToken, phone: btn.dataset.delmember}, (res)=>{
        if(res && res.ok) loadMemberList(tc);
        else alert((res && res.error) || "Could not remove member.");
      });
    };
  });
}

function renderStaffTab(tc){
  tc.innerHTML = `
    <div class="addbox" style="margin-top:0;margin-bottom:18px;">
      <p>Add a new staff member</p>
      <div class="addrow">
        <input type="text" id="newStaffName" placeholder="Full name" style="flex:1;min-width:120px;">
        <input type="text" id="newStaffUsername" placeholder="Username" style="flex:1;min-width:120px;" autocomplete="off">
        <input type="password" id="newStaffPassword" placeholder="Password (min 4 chars)" style="flex:1;min-width:140px;" autocomplete="new-password">
        <select id="newStaffRole" style="border:1px solid var(--line);background:#08121f;color:#fff;border-radius:8px;padding:7px 8px;font-size:12px;">
          <option value="staff">Staff</option>
          <option value="owner">Owner</option>
        </select>
        <button class="addgo" id="createStaffBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg> Create</button>
      </div>
      ${state.staffFormError ? `<p style="color:var(--danger);font-size:12px;margin:10px 0 0;">${esc(state.staffFormError)}</p>` : ""}
    </div>
    <div id="staffListWrap">${renderStaffListHTML()}</div>
  `;

  const createBtn = document.getElementById("createStaffBtn");
  createBtn.onclick=()=>{
    const name = document.getElementById("newStaffName").value.trim();
    const username = document.getElementById("newStaffUsername").value.trim();
    const password = document.getElementById("newStaffPassword").value;
    const role = document.getElementById("newStaffRole").value;
    if(!username || !password){ state.staffFormError="Username and password are required."; renderStaffTab(tc); return; }
    socket.emit("staff:create", {token: state.staffToken, name, username, password, role}, (res)=>{
      if(res && res.ok){
        state.staffFormError = null;
        loadStaffList(tc);
      }else{
        state.staffFormError = (res && res.error) || "Could not create staff member.";
        renderStaffTab(tc);
      }
    });
  };

  loadStaffList(tc);
}

function renderStaffListHTML(){
  if(!state.staffList) return `<p style="color:var(--muted);font-size:13px;">Loading staff…</p>`;
  if(!state.staffList.length) return `<p style="color:var(--muted);font-size:13px;">No staff accounts yet.</p>`;
  return state.staffList.map(u=>`
    <div class="edit-item" data-username="${esc(u.username)}">
      <div style="flex:1;min-width:120px;">
        <div style="font-weight:700;font-size:13px;">${esc(u.name)} ${u.username===state.staffUser.username ? '<span class="mono" style="color:var(--cyan);font-size:11px;">(you)</span>' : ''}</div>
        <div class="mono" style="color:var(--muted);font-size:11px;">@${esc(u.username)} · ${esc(u.role)}</div>
      </div>
      <input type="password" data-newpass placeholder="New password" style="width:150px;" autocomplete="new-password">
      <button class="upload-label" data-resetpass="${esc(u.username)}">Set password</button>
      ${u.username!==state.staffUser.username ? `<button data-deluser="${esc(u.username)}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 6"/></svg></button>` : ""}
    </div>
  `).join("");
}

function loadStaffList(tc){
  socket.emit("staff:list", {token: state.staffToken}, (res)=>{
    if(res && res.ok){
      state.staffList = res.users;
    }else{
      state.staffList = [];
    }
    const wrap = document.getElementById("staffListWrap");
    if(wrap){
      wrap.innerHTML = renderStaffListHTML();
      wireStaffListEvents(tc);
    }
  });
}

function wireStaffListEvents(tc){
  document.querySelectorAll("[data-resetpass]").forEach(btn=>{
    btn.onclick=()=>{
      const row = btn.closest("[data-username]");
      const pass = row.querySelector("[data-newpass]").value;
      if(!pass || pass.length<4){ alert("Password must be at least 4 characters."); return; }
      socket.emit("staff:changePassword", {token: state.staffToken, targetUsername: btn.dataset.resetpass, newPassword: pass}, (res)=>{
        if(res && res.ok){ alert("Password updated."); row.querySelector("[data-newpass]").value=""; }
        else alert((res && res.error) || "Could not update password.");
      });
    };
  });
  document.querySelectorAll("[data-deluser]").forEach(btn=>{
    btn.onclick=()=>{
      if(!confirm(`Remove staff account "${btn.dataset.deluser}"?`)) return;
      socket.emit("staff:delete", {token: state.staffToken, targetUsername: btn.dataset.deluser}, (res)=>{
        if(res && res.ok) loadStaffList(tc);
        else alert((res && res.error) || "Could not remove staff member.");
      });
    };
  });
}

function renderAccountTab(tc){
  tc.innerHTML = `
    <div class="addbox" style="margin-top:0;max-width:420px;">
      <p>Change your password</p>
      <div class="addrow">
        <input type="password" id="accNewPass" placeholder="New password (min 4 chars)" style="flex:1;min-width:180px;" autocomplete="new-password">
        <button class="addgo" id="accSaveBtn">Update password</button>
      </div>
      <p style="color:var(--muted);font-size:12px;margin:10px 0 0;">Signed in as <strong>${esc(state.staffUser.name)}</strong> (@${esc(state.staffUser.username)}, ${esc(state.staffUser.role)}).</p>
      <p id="accMsg" style="font-size:12px;margin:8px 0 0;"></p>
    </div>
  `;
  document.getElementById("accSaveBtn").onclick=()=>{
    const pass = document.getElementById("accNewPass").value;
    const msg = document.getElementById("accMsg");
    if(!pass || pass.length<4){ msg.style.color="var(--danger)"; msg.textContent="Password must be at least 4 characters."; return; }
    socket.emit("staff:changePassword", {token: state.staffToken, targetUsername: state.staffUser.username, newPassword: pass}, (res)=>{
      if(res && res.ok){ msg.style.color="var(--lime)"; msg.textContent="Password updated."; document.getElementById("accNewPass").value=""; }
      else{ msg.style.color="var(--danger)"; msg.textContent=(res && res.error) || "Could not update password."; }
    });
  };
}

/* seed default menu if empty */

// Backward-compatible payment fields for existing orders.
state.orders.forEach(o=>{
  if(!o.paymentStatus) o.paymentStatus = "unpaid";
});
saveOrders();

if(!localStorage.getItem("jb_menu")) saveMenu();

render();
</script>
